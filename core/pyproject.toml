[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke-core"
version = "0.1.0"
description = "Общее ядро karaoke-services: БД, имена, формат UltraStar, постобработка"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["karaoke_core*"]
