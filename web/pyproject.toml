[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke-web"
version = "0.1.0"
description = "Веб-сервис karaoke-services: REST API (FastAPI) и статический фронтенд"
requires-python = ">=3.12"
# karaoke-core ставится отдельно из ../core (в PyPI его нет).
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]
