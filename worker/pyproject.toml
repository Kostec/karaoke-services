[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke-worker"
version = "0.1.0"
description = "Исполнитель заданий karaoke-services: UltraSinger на GPU"
requires-python = ">=3.12"
dependencies = ["karaoke-core"]

[tool.setuptools.packages.find]
include = ["karaoke_worker*"]
