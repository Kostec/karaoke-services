# karaoke-services: web + worker на Linux-движке Docker Desktop.
# Запуск только через контекст desktop-linux: ./scripts/compose.ps1 up -d --build
# Тесты: ./scripts/compose.ps1 --profile test run --rm tests

name: karaoke-services

x-env: &app-env
  DATA_DIR: /data
  MODELS_DIR: /models
  OUTPUT_KIND: ${OUTPUT_KIND:-smb}
  OUTPUT_SMB_HOST: ${OUTPUT_SMB_HOST:-192.168.0.129}
  OUTPUT_SMB_SHARE: ${OUTPUT_SMB_SHARE:-karaoke}
  OUTPUT_SMB_PATH: ${OUTPUT_SMB_PATH:-}
  OUTPUT_SMB_USER: ${OUTPUT_SMB_USER:-}
  OUTPUT_SMB_PASSWORD: ${OUTPUT_SMB_PASSWORD:-}
  LOCAL_OUTPUT_ROOT: ${LOCAL_OUTPUT_ROOT:-./output}
  TRASH_DAYS: ${TRASH_DAYS:-30}
  LOG_DAYS: ${LOG_DAYS:-30}
  DEFAULT_WHISPER_MODEL: ${DEFAULT_WHISPER_MODEL:-large-v2}
  DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-ru}
  DEFAULT_COMPUTE_TYPE: ${DEFAULT_COMPUTE_TYPE:-int8}
  DEFAULT_BATCH_SIZE: ${DEFAULT_BATCH_SIZE:-4}
  DEFAULT_ALIGN_MODEL_RU: ${DEFAULT_ALIGN_MODEL_RU:-jonatasgrosman/wav2vec2-large-xlsr-53-russian}
  TZ: ${TZ:-Europe/Moscow}
  # yt-dlp: веб — метаданные ссылок, воркер — загрузка звука (пусто — python -m yt_dlp образа).
  YTDLP_CMD: ${YTDLP_CMD:-}

# Постоянные DNS и только IPv4: у контейнеров нет IPv6-маршрута, а Яндекс/YouTube отдают AAAA первыми.
x-net: &app-net
  dns: [77.88.8.8, 1.1.1.1]
  sysctls:
    - net.ipv6.conf.all.disable_ipv6=1

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    <<: *app-net
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:8080"
    environment:
      <<: *app-env
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_IMPORT_MB: ${MAX_IMPORT_MB:-500}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-2000}
    volumes:
      - data:/data
      - ${LOCAL_OUTPUT_ROOT:-./output}:/output

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      # Исходники UltraSinger: git-URL ветки (…git#karaoke-local) или путь к локальной папке.
      additional_contexts:
        ultrasinger: ${ULTRASINGER_GIT:-https://github.com/Kostec/UltraSinger.git#karaoke-local}
    image: karaoke-services-worker
    <<: *app-net
    restart: unless-stopped
    environment:
      <<: *app-env
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
      XDG_CACHE_HOME: /models/xdg
      PYHYPHEN_DIR: /models/hyphen
    volumes:
      - data:/data
      - models:/models
      - ${LOCAL_OUTPUT_ROOT:-./output}:/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: core/Dockerfile.test
    working_dir: /app
    volumes:
      - ./:/app

volumes:
  data:
  models:
